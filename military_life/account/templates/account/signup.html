{% extends 'base.html' %}
{% load static %}

{% block title %}회원가입 - 진격의 박병장{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:520px">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title mb-4">회원가입</h3>
      <form method="post" novalidate>
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger">양식을 확인하세요.</div>
        {% endif %}

        <div class="mb-3">
          <label class="form-label">아이디</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">이메일</label>
          {{ form.email }}
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          {{ form.password1 }}
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호 확인</label>
          {{ form.password2 }}
        </div>

        <button class="btn btn-primary w-100">회원가입</button>
      </form>
      <hr>
      <p class="text-center mb-0">이미 계정이 있으신가요? <a href="{% url 'account:login' %}">로그인</a></p>
    </div>
  </div>
</div>
{% endblock %}
