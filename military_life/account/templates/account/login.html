{% extends 'base_auth.html' %}
{% load static %}

{% block title %}로그인 - 진격의 박병장{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-tabs">
        <a href="{% url 'account:login' %}" class="auth-tabs__item active">로그인</a>
        <a href="{% url 'account:signup' %}" class="auth-tabs__item">회원가입</a>
    </div>

    <div class="auth-body">
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-field">
                <label for="{{ form.username.id_for_label }}">아이디</label>
                {{ form.username }}
            </div>
            <div class="form-field">
                <label for="{{ form.password.id_for_label }}">비밀번호</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <button type="submit" class="btn-block">로그인</button>
        </form>
    </div>
</div>
{% endblock %}
