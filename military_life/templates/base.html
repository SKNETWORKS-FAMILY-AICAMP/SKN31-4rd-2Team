{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}진격의 박병장{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/common.css' %}">
{% block extra_css %}{% endblock %}
</head>
<body>

<header class="navbar">
    <a href="{% url 'home:home' %}" class="navbar__brand">
        <span class="navbar__logo">🛡️</span>
        <span>국방 도우미</span>
    </a>

    <nav class="navbar__menu">
        <a href="{% url 'home:home' %}"
           class="navbar__item {% block nav_home_active %}{% endblock %}">
            <span class="icon">🏠</span> 홈
        </a>
        <a href="{% url 'chatbot:chat' %}"
           class="navbar__item {% block nav_chatbot_active %}{% endblock %}">
            <span class="icon">💬</span> 챗봇
        </a>
        <a href="{% url 'records:records' %}"
           class="navbar__item {% block nav_records_active %}{% endblock %}">
            <span class="icon">📖</span> 개인 기록
        </a>
        <a href="{% url 'board:list' %}"
           class="navbar__item {% block nav_board_active %}{% endblock %}">
            <span class="icon">👥</span> 커뮤니티
        </a>
    </nav>

    <div class="navbar__actions">
        <button class="icon-btn" title="알림">🔔</button>
        {# TODO(account팀): 로그인 상태에 따라 로그인/로그아웃 링크 분기 #}
        <a class="icon-btn" href="{% url 'account:logout' %}" title="로그아웃">↪</a>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
